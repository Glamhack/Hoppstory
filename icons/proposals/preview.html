<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Logo proposals</title>
<style>
 body{font-family:system-ui,sans-serif;margin:24px;background:#f4f4f4;color:#1a1a1a}
 .row{display:flex;gap:24px;flex-wrap:wrap}
 .card{background:#fff;border-radius:12px;padding:20px;width:300px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
 .card img.big{width:100%;height:220px;object-fit:contain}
 .sizes{display:flex;gap:12px;align-items:end;margin-top:12px}
 .bar{background:#d52b1e;border-radius:8px;padding:8px;display:flex;gap:8px;align-items:center;margin-top:12px}
 .bar span{color:#fff;font-weight:600}
 .bar img{background:#fff;border-radius:6px;padding:2px}
</style></head><body>
<h1>Hopp!Story – Logo-Vorschläge</h1>
<div class="row">
 <div class="card"><h2>4 · Lorbeer-Pin</h2><img class="big" src="logo-4-lorbeer-pin.svg">
  <div class="sizes"><img src="logo-4-lorbeer-pin.svg" width="64"><img src="logo-4-lorbeer-pin.svg" width="32"><img src="logo-4-lorbeer-pin.svg" width="16"></div>
  <div class="bar"><img src="logo-4-lorbeer-pin.svg" width="28"><span>Hopp!Story</span></div></div>
 <div class="card"><h2>5 · Medaillen-Pin</h2><img class="big" src="logo-5-medaille-pin.svg">
  <div class="sizes"><img src="logo-5-medaille-pin.svg" width="64"><img src="logo-5-medaille-pin.svg" width="32"><img src="logo-5-medaille-pin.svg" width="16"></div>
  <div class="bar"><img src="logo-5-medaille-pin.svg" width="28"><span>Hopp!Story</span></div></div>
 <div class="card"><h2>6 · Hopp!-Pin</h2><img class="big" src="logo-6-hopp-pin.svg">
  <div class="sizes"><img src="logo-6-hopp-pin.svg" width="64"><img src="logo-6-hopp-pin.svg" width="32"><img src="logo-6-hopp-pin.svg" width="16"></div>
  <div class="bar"><img src="logo-6-hopp-pin.svg" width="28"><span>Hopp!Story</span></div></div>
 <div class="card"><h2>3 · Wortmarke</h2><img class="big" src="logo-3-wortmarke.svg">
  <div class="sizes"><img src="logo-3-wortmarke.svg" width="200"><img src="logo-3-wortmarke.svg" width="120"></div></div>
</div></body></html>
